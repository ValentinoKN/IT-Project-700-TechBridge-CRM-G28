services:
  # PostgreSQL holds the CRM data. Docker keeps it separate from the Django web app.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: techbridge_crm
      POSTGRES_USER: techbridge
      POSTGRES_PASSWORD: techbridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techbridge -d techbridge_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # This is the app people open in the browser on localhost:8000.
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: techbridge_crm
      POSTGRES_USER: techbridge
      POSTGRES_PASSWORD: techbridge
      POSTGRES_HOST: db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
