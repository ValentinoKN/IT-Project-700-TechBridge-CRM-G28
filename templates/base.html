<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechBridge CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f5f7; }
    .navbar-brand { font-weight: 700; }
    .card-number { font-size: 1.8rem; font-weight: 700; }
    .table td, .table th { vertical-align: middle; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">TechBridge CRM</a>
      {% if user.is_authenticated %}
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'company_list' %}">Companies</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'contact_list' %}">Contacts</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lead_list' %}">Leads</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'deal_list' %}">Deals</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'activity_list' %}">Activities</a></li>
        </ul>
        <span class="navbar-text me-3">{{ user.username }} ({{ user.get_role_display }})</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Logout</button></form>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="container pb-4">
    {% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
