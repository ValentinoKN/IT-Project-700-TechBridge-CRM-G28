{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3">TechBridge CRM</h1><p class="text-muted">Sign in to continue.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-dark w-100">Login</button>
    </form>
    <p class="small text-muted mt-3 mb-0">Demo login details are in the README.</p>
  </div></div>
</div></div>
{% endblock %}
