{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3"><h1 class="h3">Deals</h1><div><a class="btn btn-outline-secondary" href="{% url 'export_csv' 'deals' %}">Export CSV</a> <a class="btn btn-dark" href="{% url 'deal_add' %}">Add deal</a></div></div>
<form class="mb-3"><input name="q" value="{{ term }}" class="form-control" placeholder="Search deal or contact"></form>
<div class="card"><div class="table-responsive"><table class="table mb-0"><tr><th>Deal</th><th>Contact</th><th>Stage</th><th>Value</th><th>Owner</th><th></th></tr>{% for item in deals %}<tr><td>{{ item.title }}</td><td>{{ item.contact }}</td><td>{{ item.stage }}</td><td>R{{ item.value }}</td><td>{{ item.owner.username }}</td><td><a href="{% url 'deal_edit' item.pk %}">Edit</a></td></tr>{% empty %}<tr><td colspan="6">No deals found.</td></tr>{% endfor %}</table></div></div>
{% endblock %}
