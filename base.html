<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechBridge CRM</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
        nav { background: #222; color: white; padding: 14px 8%; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-left: 14px; }
        nav .logo { margin-left: 0; font-weight: bold; }
        main { width: 84%; max-width: 1050px; margin: 28px auto; }
        h1, h2 { margin-top: 26px; }
        .cards { display: flex; gap: 12px; flex-wrap: wrap; }
        .card { background: white; border: 1px solid #ccc; padding: 16px; min-width: 180px; }
        .card strong { display: block; font-size: 30px; }
        .card span { color: #555; }
        .simple-form { background: white; border: 1px solid #ccc; padding: 16px; max-width: 550px; }
        label { display: block; margin-bottom: 10px; }
        input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 8px; border: 1px solid #aaa; }
        textarea { min-height: 80px; }
        button { background: #222; color: white; border: 0; padding: 9px 14px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ccc; padding: 9px; text-align: left; vertical-align: top; }
        th { background: #e6e6e6; }
        .message { background: #e9e9e9; border-left: 4px solid #333; padding: 10px; }
        .status-form { display: flex; gap: 5px; align-items: center; }
        .status-form select { margin: 0; min-width: 110px; }
        @media (max-width: 650px) { main { width: 92%; } nav { display: block; } nav div { margin-top: 10px; } table { font-size: 13px; } }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="{{ url_for('dashboard') }}">TechBridge CRM</a>
        <div>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('customers') }}">Customers</a>
            <a href="{{ url_for('tickets') }}">Tickets</a>
        </div>
    </nav>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
